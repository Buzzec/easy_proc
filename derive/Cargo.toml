[package]
name = "easy_proc_derive"
version = "0.4.0"
authors = ["Brett Etter <brett@staratlas.com>"]
edition = "2021"
description = "Derive macros for `easy_proc`"
documentation = "https://docs.rs/easy_proc_derive/latest/easy_proc_derive/"
repository = "https://github.com/Buzzec/easy_proc"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
easy_proc_common = { version = "0.4.0", path = "../common" }
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro-error2 = "2.0.1"
proc-macro-crate = "3.2.0"

[dev-dependencies]
easy_proc = { path = ".." }
